<header><h1>РК-1 · Векторная алгебра, прямые и плоскости</h1><p>Правила, калькуляторы, разбор вариантов 1–2, свои задачи и словарь</p></header>
<nav id="nav"></nav><main id="app"></main>
<script>
var $=function(s){return document.querySelector(s)};
var TABS=[["r","Правила"],["k","Калькулятор"],["t","Варианты 1–2"],["o","Свои задачи"],["d","Словарь"]],cur="r";
var R=[
["Скалярное произведение","a·b = x₁x₂ + y₁y₂ + z₁z₂ = |a||b|cos φ","Ноль ⇔ векторы перпендикулярны. Угол между векторами: cos φ = a·b/(|a||b|)."],
["Векторное произведение","a×b = det[i j k; a; b], |a×b| = |a||b|sin φ","Антикоммутативно (a×b = −b×a), a×a = 0, линейно. Площадь параллелограмма = |a×b|, треугольника = ½|a×b|. Для a = αm+βn, b = γm+δn: a×b = (αδ−βγ)·m×n."],
["Смешанное произведение","(a×b)·c = det 3×3","V параллелепипеда = |(a×b)·c|, V пирамиды = ⅙|…|. Высота H = V / S основания. Ноль ⇔ векторы компланарны."],
["Вектор, ортогональный двум","p = λ(m×n)","|p| = |λ||m×n|. Знак λ определяется условием на угол с осью (острый ⇒ компонента > 0, тупой ⇒ < 0)."],
["Параллелограмм ABCD","D = A + C − B","Диагонали делятся пополам: A + C = B + D. Угол между диагоналями: cos φ = |AC·BD|/(|AC||BD|) (острый ⇒ модуль)."],
["Прямая на плоскости","Ax + By + C = 0, нормаль n = (A, B), направление (−B, A)","Расстояние от точки: |Ax₀+By₀+C|/√(A²+B²). Высота ⟂ стороне: нормаль высоты = направляющий вектор стороны."],
["Симметричная точка (прямая)","Q = P + t·n, P′ = 2Q − P","t находим, подставив Q в уравнение прямой. Проверка: значения Ax+By+C в P и P′ противоположны."],
["Пересечение высот","A, B, C — пересечение пар сторон; две высоты → система","Третья высота — проверка."],
["Прямая в пространстве","(x−x₀)/l = (y−y₀)/m = (z−z₀)/n","Параметры: x = x₀+lt, y = y₀+mt, z = z₀+nt. Через две точки: направление M₁M₂."],
["Прямая ∩ плоскость","подставить x(t), y(t), z(t) в уравнение плоскости","Получить t, затем координаты точки."],
["Плоскость","A(x−x₀)+B(y−y₀)+C(z−z₀)=0, нормаль (A,B,C)","Параллельные плоскости имеют одну нормаль, различаются свободным членом."]];
function rules(){var h="";R.forEach(function(r){h+='<div class="c"><h3>'+r[0]+'</h3><span class="f">'+r[1]+'</span><div class="m">'+r[2]+'</div></div>'});return h}
/* чертёж 2D */
function draw(o){var P=o.pts,k=Object.keys(P),xs=k.map(function(i){return P[i][0]}),ys=k.map(function(i){return P[i][1]});
var x0=Math.min.apply(0,xs)-1.5,x1=Math.max.apply(0,xs)+1.5,y0=Math.min.apply(0,ys)-1.5,y1=Math.max.apply(0,ys)+1.5;
var W=340,H=260,s=Math.min(W/(x1-x0),H/(y1-y0));
var X=function(x){return 10+(x-x0)*s},Y=function(y){return H-10-(y-y0)*s};var g="";
if(o.line){var a=o.line[0],b=o.line[1],c=o.line[2],p,q;
if(Math.abs(b)>1e-9){p=[x0,-(a*x0+c)/b];q=[x1,-(a*x1+c)/b]}else{p=[-c/a,y0];q=[-c/a,y1]}
g+='<line x1="'+X(p[0])+'" y1="'+Y(p[1])+'" x2="'+X(q[0])+'" y2="'+Y(q[1])+'" stroke="var(--ac)" stroke-width="1.6"/>'}
(o.segs||[]).forEach(function(e){g+='<line x1="'+X(P[e[0]][0])+'" y1="'+Y(P[e[0]][1])+'" x2="'+X(P[e[1]][0])+'" y2="'+Y(P[e[1]][1])+'" stroke="'+(e[2]==2?'var(--ac)':e[2]?'var(--ok)':'var(--ink)')+'" stroke-width="1.5"'+(e[2]==1?' stroke-dasharray="5 4"':'')+(e[2]==2?' marker-end="url(#ar)"':'')+'/>'});
k.forEach(function(i){g+='<circle cx="'+X(P[i][0])+'" cy="'+Y(P[i][1])+'" r="4" fill="var(--ink)"/><text x="'+(X(P[i][0])+7)+'" y="'+(Y(P[i][1])-6)+'" font-size="13" fill="var(--ink)">'+i+'</text>'});
return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Чертёж">'+DEF+g+'</svg>'}
/* задачи */
var T=[
{g:"Вар. 1 · №1",c:"Параллелепипед: A(1,−2,0), B(3,−1,1), C(2,2,2), A₁(2,0,3). Найти V и высоту на ABCD.",s:["Три ребра из одной вершины: AB = (2,1,1), AD = BC = (−1,3,1), AA₁ = (1,2,3). Не берём AC — это диагональ грани.","AB×AD = (−2,−3,7); площадь основания S = √(4+9+49) = √62.","Смешанное: (−2,−3,7)·(1,2,3) = −2−6+21 = 13 ⇒ V = 13.","H = V/S = 13/√62.","Проверка: плоскость ABCD: −2x−3y+7z−4 = 0, расстояние от A₁ = |−4+21−4|/√62 = 13/√62."],a:"V = 13, H = 13/√62"},
{g:"Вар. 1 · №2",c:"Вектор p ⟂ m=(1,2,0), n=(0,1,2): (а) |p|=2√21, острый угол с OY; (б) |p|=√21, тупой угол с OY.",s:["p ∥ m×n. Считаем: m×n = (4,−2,1).","|m×n| = √(16+4+1) = √21, значит p = λ(4,−2,1).","(а) |λ| = 2. Острый угол с OY ⇒ pʏ > 0, а pʏ = −2λ ⇒ λ = −2.","(б) |λ| = 1. Тупой угол ⇒ pʏ < 0 ⇒ −2λ < 0 ⇒ λ = 1.","Проверка скалярными произведениями с m и n: оба равны 0."],a:"(а) (−8, 4, −2); (б) (4, −2, 1)"},
{g:"Вар. 1 · №3",c:"Стороны: AB: x−4y=0, BC: 2x+3y−11=0, AC: 3x−y=0. Найти точку пересечения высот.",fig:{pts:{A:[0,0],B:[4,1],C:[1,3],H:[14/11,21/11]},segs:[["A","B"],["B","C"],["A","C"],["A","H",1],["C","H",1]]},s:["Вершины из пар сторон: A = AB∩AC = (0,0), B = AB∩BC = (4,1), C = BC∩AC = (1,3).","Высота из A ⟂ BC. Направление BC = (−3,2) — это нормаль высоты: −3x+2y = 0.","Высота из C ⟂ AB. Направление AB = (4,1): 4(x−1)+(y−3) = 0 ⇒ 4x+y−7 = 0.","Подставляем y = 3x/2: 4x+1,5x = 7 ⇒ x = 14/11, y = 21/11.","Проверка: высота из B: (x−4)+3(y−1) = 0; в точке H даёт 0."],a:"H(14/11, 21/11)"},
{g:"Вар. 1 · №4",c:"Прямая через M₁(2,−1,1) и точку M₂ = ℓ ∩ π, где ℓ: (x−1)/2 = (y+1)/1 = (z−2)/(−1), π: x−2y+z−1=0.",s:["Параметры ℓ: x = 1+2t, y = −1+t, z = 2−t.","В π: (1+2t) − 2(−1+t) + (2−t) − 1 = 4 − t = 0 ⇒ t = 4.","M₂ = (9, 3, −2). Направление M₁M₂ = (7, 4, −3).","Канонически: (x−2)/7 = (y+1)/4 = (z−1)/(−3).","Проверка: M₂ в π: 9−6−2−1 = 0."],a:"(x−2)/7 = (y+1)/4 = (z−1)/(−3)"},
{g:"Вар. 2 · №1",c:"Площадь треугольника на a=2m−3n, b=m+2n; |m|=3, |n|=4, ∠(m,n)=π/6.",s:["a×b = (2m−3n)×(m+2n) = 4 m×n − 3 n×m = 7 m×n (m×m = n×n = 0).","Проверка коэффициента: det[2 −3; 1 2] = 7.","|m×n| = 3·4·sin(π/6) = 6.","S = ½·|a×b| = ½·7·6 = 21."],a:"S = 21"},
{g:"Вар. 2 · №2",c:"Параллелограмм ABCD: A(1,−1,2), B(3,0,1), C(2,3,3). Найти D и острый угол между диагоналями.",s:["D = A + C − B = (1+2−3, −1+3−0, 2+3−1) = (0,2,4).","AC = (1,4,1), BD = (−3,2,3).","AC·BD = −3+8+3 = 8; |AC| = √18, |BD| = √22.","cos φ = |8|/(√18·√22) = 4/(3√11) (модуль даёт острый угол).","Проверка: AD = (−1,3,2) = BC."],a:"D(0,2,4); φ = arccos(4/(3√11))"},
{g:"Вар. 2 · №3",c:"Точка, симметричная P(2,5) относительно прямой BC, B(−1,1), C(3,3).",fig:{pts:{P:[2,5],"P′":[4,1],B:[-1,1],C:[3,3]},segs:[["P","P′",1]],line:[1,-2,3]},s:["Направление BC = (4,2) ∥ (2,1); нормаль n = (1,−2).","Прямая: (x+1) − 2(y−1) = 0 ⇒ x − 2y + 3 = 0.","Основание перпендикуляра Q = P + t·n = (2+t, 5−2t). Подстановка: (2+t) − 2(5−2t) + 3 = 5t − 5 = 0 ⇒ t = 1, Q = (3,3).","P′ = 2Q − P = (4, 1).","Проверка: значения x−2y+3 в P и P′: −5 и 5."],a:"P′(4, 1)"},
{g:"Вар. 2 · №4",c:"Плоскость ∥ σ₁: 2x−y+3z−7=0 через точку ℓ∩σ₂; ℓ: (x+1)/1=(y−2)/(−2)=z/3, σ₂: x+y−z+7=0.",s:["x = −1+t, y = 2−2t, z = 3t.","В σ₂: (−1+t)+(2−2t)−3t+7 = 8 − 4t = 0 ⇒ t = 2.","M = (1, −2, 6). Нормаль та же: (2,−1,3).","2(x−1) − (y+2) + 3(z−6) = 0 ⇒ 2x − y + 3z − 22 = 0.","Проверка: M: 2+2+18−22 = 0; свободные члены −7 и −22 различны ⇒ плоскости параллельны."],a:"2x − y + 3z − 22 = 0"}];
var O=[
{g:"Своя №1",c:"Площадь треугольника на a=m+2n, b=3m−n; |m|=2, |n|=5, ∠(m,n)=π/3.",s:["a×b = (m+2n)×(3m−n) = −m×n + 6 n×m = −7 m×n.","|m×n| = 2·5·sin(π/3) = 5√3.","S = ½·7·5√3 = 35√3/2."],a:"S = 35√3/2"},
{g:"Своя №2",c:"Симметричная точка для P(1,4) относительно прямой x + y − 2 = 0.",fig:{pts:{P:[1,4],"P′":[-2,1],Q:[-.5,2.5]},segs:[["P","P′",1]],line:[1,1,-2]},s:["n = (1,1). Q = (1+t, 4+t).","(1+t)+(4+t)−2 = 0 ⇒ t = −3/2 ⇒ Q = (−1/2, 5/2).","P′ = 2Q − P = (−2, 1).","Проверка: значения в P и P′: 3 и −3."],a:"P′(−2, 1)"},
{g:"Своя №3",c:"Прямая через M₁(1,1,1) и точку пересечения ℓ: x/1=(y−1)/2=(z+1)/(−1) с плоскостью 2x−y+z−3=0.",s:["x = t, y = 1+2t, z = −1−t.","2t − (1+2t) + (−1−t) − 3 = −t − 5 = 0 ⇒ t = −5.","M₂ = (−5, −9, 4); M₁M₂ = (−6, −10, 3).","(x−1)/(−6) = (y−1)/(−10) = (z−1)/3."],a:"(x−1)/(−6) = (y−1)/(−10) = (z−1)/3"},
{g:"Своя №4",c:"Объём пирамиды на a=(1,2,3), b=(0,1,−1), c=(2,0,1).",s:["det = 1·(1·1−(−1)·0) − 2·(0·1−(−1)·2) + 3·(0·0−1·2) = 1 − 4 − 6 = −9.","Параллелепипед: |−9| = 9; пирамида — ⅙ от него.","V = 9/6 = 3/2. Определитель ≠ 0 ⇒ векторы не компланарны."],a:"V = 3/2"},
{g:"Своя №5",c:"Расстояние от M(3,−1) до прямой 4x + 3y − 5 = 0.",s:["d = |4·3 + 3·(−1) − 5| / √(16+9).","= |12 − 3 − 5| / 5 = 4/5."],a:"d = 4/5"},
{g:"Своя №6",c:"Найти вектор p ⟂ m=(2,1,0), n=(0,1,1), |p|=√6, тупой угол с OZ.",s:["m×n = (1·1−0·1, 0·0−2·1, 2·1−0) = (1,−2,2); |m×n| = 3.","p = λ(1,−2,2), |λ| = √6/3.","Тупой угол с OZ ⇒ pᴢ = 2λ < 0 ⇒ λ = −√6/3.","p = (−√6/3, 2√6/3, −2√6/3)."],a:"p = (−√6/3, 2√6/3, −2√6/3)"}];
var D=[["Скалярное произведение","Число a·b; нулевое ⇔ векторы перпендикулярны."],["Векторное произведение","Вектор a×b, перпендикулярный обоим; длина = площадь параллелограмма."],["Смешанное произведение","Число (a×b)·c; модуль = объём параллелепипеда."],["Компланарные векторы","Лежат в одной плоскости; смешанное произведение = 0."],["Коллинеарные векторы","Параллельны одной прямой; векторное произведение = 0."],["Нормаль (нормальный вектор)","Вектор, перпендикулярный прямой или плоскости: (A,B) или (A,B,C)."],["Направляющий вектор","Вектор вдоль прямой; задаёт её направление."],["Канонические уравнения прямой","(x−x₀)/l = (y−y₀)/m = (z−z₀)/n."],["Параметрические уравнения","x = x₀+lt, y = y₀+mt, z = z₀+nt."],["Общее уравнение","Ax + By + C = 0 (прямая), Ax + By + Cz + D = 0 (плоскость)."],["Ортогональный","Перпендикулярный (скалярное произведение = 0)."],["Основание перпендикуляра","Точка, где перпендикуляр из точки пересекает прямую или плоскость."],["Ортоцентр","Точка пересечения высот треугольника."],["Диагонали параллелограмма","Делятся точкой пересечения пополам: A + C = B + D."],["Острый угол между прямыми","cos φ = |u·v|/(|u||v|), модуль даёт угол от 0 до π/2."],["Проекция вектора","Прu a = (a·u)/|u|."]];

/* подробные решения */
T[0].s=['<b>Что нужно:</b> объём V и высота H. Объём считаем по трём рёбрам из ОДНОЙ вершины. Из A выходят AB, AD, AA₁. Вектор AD не дан, но ABCD — параллелограмм, значит AD = BC. (AC брать нельзя: это диагональ грани.)','<b>Координаты рёбер:</b> AB = B−A = (3−1, −1+2, 1−0) = (2,1,1); AD = BC = C−B = (2−3, 2+1, 2−1) = (−1,3,1); AA₁ = A₁−A = (1,2,3).','<b>Векторное произведение</b> u×v даёт нормаль к основанию: i(1·1−1·3) − j(2·1−1·(−1)) + k(2·3−1·(−1)) = (−2, −3, 7).','<b>Площадь основания</b> — длина этого вектора: S = √(4+9+49) = √62.','<b>Объём:</b> (u×v)·w = (−2)·1 + (−3)·2 + 7·3 = −2−6+21 = 13. Знак зависит от порядка векторов, поэтому берём модуль: V = 13.','<b>Высота:</b> V = S·H ⇒ H = V/S = 13/√62 (≈ 1,65).','<b>Проверка другим способом:</b> плоскость ABCD через A с нормалью (−2,−3,7): −2(x−1)−3(y+2)+7z = 0 ⇒ −2x−3y+7z−4 = 0. Расстояние от A₁(2,0,3): |−4+0+21−4|/√62 = 13/√62 ✓.'];
T[1].s=['<b>Идея:</b> вектор, перпендикулярный двум данным, — это их векторное произведение (с точностью до множителя). Поэтому p = λ·(m×n).','<b>Считаем:</b> m×n = i(2·2−0·1) − j(1·2−0·0) + k(1·1−2·0) = (4, −2, 1).','<b>Длина:</b> |m×n| = √(16+4+1) = √21. Значит |p| = |λ|·√21.','<b>(а)</b> |p| = 2√21 ⇒ |λ| = 2. Угол с осью OY острый ⇔ cos > 0 ⇔ y-компонента p положительна. Она равна −2λ, поэтому −2λ > 0 ⇒ λ = −2 ⇒ p = (−8, 4, −2).','<b>(б)</b> |p| = √21 ⇒ |λ| = 1. Угол тупой ⇔ y-компонента < 0: −2λ < 0 ⇒ λ = 1 ⇒ p = (4, −2, 1).','<b>Проверка:</b> (4,−2,1)·(1,2,0) = 4−4 = 0; (4,−2,1)·(0,1,2) = −2+2 = 0 ✓.'];
T[2].s=['<b>Вершины</b> — пересечения пар сторон. A = AB∩AC: x = 4y и y = 3x ⇒ x = 12x ⇒ x = 0 ⇒ A(0,0).','B = AB∩BC: x = 4y ⇒ 8y+3y = 11 ⇒ y = 1, x = 4 ⇒ B(4,1). C = BC∩AC: y = 3x ⇒ 2x+9x = 11 ⇒ x = 1, y = 3 ⇒ C(1,3).','<b>Высота из A ⟂ BC.</b> Направление BC = C−B = (−3,2). Раз высота перпендикулярна BC, этот вектор — её нормаль: −3x+2y = 0 (проходит через A(0,0)).','<b>Высота из C ⟂ AB.</b> Направление AB = (4,1) — нормаль высоты: 4(x−1)+1·(y−3) = 0 ⇒ 4x+y−7 = 0.','<b>Пересечение:</b> из первой y = 3x/2. Во вторую: 4x+3x/2 = 7 ⇒ 11x/2 = 7 ⇒ x = 14/11, y = 21/11.','<b>Проверка</b> по третьей высоте (из B ⟂ AC, AC = (1,3)): (x−4)+3(y−1) = 0. Подставляем: 14/11−4+63/11−3 = 77/11−7 = 0 ✓.'];
T[3].s=['<b>План:</b> сначала найти M₂ — точку пересечения ℓ и π, потом провести прямую через M₁ и M₂. Запишем ℓ параметрически: каждое отношение равно t ⇒ x = 1+2t, y = −1+t, z = 2−t.','<b>Подставляем в π</b> (x−2y+z−1 = 0): (1+2t) − 2(−1+t) + (2−t) − 1 = 1+2t+2−2t+2−t−1 = 4−t.','4−t = 0 ⇒ t = 4. Возвращаемся в параметры: x = 9, y = 3, z = −2 ⇒ M₂(9, 3, −2).','<b>Направляющий вектор:</b> M₁M₂ = (9−2, 3+1, −2−1) = (7, 4, −3). Нулей нет, поэтому каноническое уравнение пишется без оговорок.','<b>Каноническое уравнение</b> через M₁(2,−1,1): (x−2)/7 = (y+1)/4 = (z−1)/(−3).','<b>Проверка:</b> M₂ в плоскости: 9−6−2−1 = 0 ✓; в каноническом уравнении для M₂ все три отношения равны 1 ✓.'];
T[4].s=['<b>Идея:</b> раскрываем скобки как в алгебре, но помним два правила: m×n = −n×m и v×v = 0.','(2m−3n)×(m+2n) = 2 m×m + 4 m×n − 3 n×m − 6 n×n. Нулевые слагаемые: m×m = 0, n×n = 0. Остаётся 4 m×n − 3 n×m.','Заменяем n×m = −m×n: −3 n×m = +3 m×n. Итого 4+3 = 7, то есть a×b = 7 m×n. <i>Быстрая проверка:</i> det[2 −3; 1 2] = 4+3 = 7.','<b>Длина:</b> |m×n| = |m||n| sin φ = 3·4·sin(π/6) = 12·½ = 6.','<b>Площадь:</b> треугольник — половина параллелограмма: S = ½|a×b| = ½·7·6 = 21.'];
T[5].s=['<b>Свойство:</b> диагонали параллелограмма делятся пополам, поэтому середины AC и BD совпадают: (A+C)/2 = (B+D)/2 ⇒ D = A + C − B.','D = (1+2−3, −1+3−0, 2+3−1) = (0, 2, 4). <i>Проверка:</i> AD = (−1,3,2) и BC = (−1,3,2) равны ✓.','<b>Диагонали:</b> AC = C−A = (1,4,1), BD = D−B = (−3,2,3).','<b>Скалярное:</b> AC·BD = −3+8+3 = 8. Длины: |AC| = √(1+16+1) = √18, |BD| = √(9+4+9) = √22.','cos φ = 8/(√18·√22) = 8/√396 = 8/(6√11) = 4/(3√11). Получилось положительное — угол острый. Если бы вышло отрицательное, взяли бы модуль.'];
T[6].s=['<b>Идея:</b> опускаем из P перпендикуляр на прямую BC. Его основание Q — середина PP′. Для начала нужно уравнение прямой.','<b>Прямая BC:</b> направление (3+1, 3−1) = (4,2) ∥ (2,1). Нормаль — поворот на 90°: n = (1,−2). Уравнение: 1·(x+1) − 2·(y−1) = 0 ⇒ x − 2y + 3 = 0.','Перпендикуляр из P идёт вдоль нормали: Q = P + t·n = (2+t, 5−2t).','<b>Q на прямой:</b> (2+t) − 2(5−2t) + 3 = 2+t−10+4t+3 = 5t−5 = 0 ⇒ t = 1 ⇒ Q = (3,3). (Случайно совпало с C — это нормально.)','<b>Q — середина PP′,</b> значит P′ = 2Q − P = (6−2, 6−5) = (4, 1).','<b>Проверка:</b> подставим P и P′ в x−2y+3: 2−10+3 = −5 и 4−2+3 = 5. Знаки противоположны, модули равны ✓.'];
T[7].s=['<b>Ключевой факт:</b> параллельные плоскости имеют одну нормаль. У σ₁ она (2,−1,3), поэтому искомая плоскость 2x − y + 3z + D = 0. Остаётся найти D, для этого нужна точка.','<b>Точка M = ℓ∩σ₂.</b> Параметры ℓ: x = −1+t, y = 2−2t, z = 3t.','В σ₂ (x+y−z+7 = 0): (−1+t) + (2−2t) − 3t + 7 = 8 − 4t = 0 ⇒ t = 2.','M = (−1+2, 2−4, 6) = (1, −2, 6).','<b>Находим D:</b> подставляем M: 2·1 − (−2) + 3·6 + D = 0 ⇒ 2+2+18+D = 0 ⇒ D = −22. Плоскость: 2x − y + 3z − 22 = 0.','<b>Проверка:</b> нормали одинаковые, свободные члены −7 и −22 разные ⇒ плоскости параллельны и не совпадают ✓.'];
O[0].s=['<b>Раскрываем скобки:</b> (m+2n)×(3m−n) = 3 m×m − m×n + 6 n×m − 2 n×n.','m×m = n×n = 0. Остаётся −m×n + 6 n×m = −m×n − 6 m×n = −7 m×n. <i>Проверка:</i> det[1 2; 3 −1] = −1−6 = −7.','<b>Длина:</b> |m×n| = 2·5·sin(π/3) = 10·√3/2 = 5√3. Знак минус на длину не влияет, берём модуль.','<b>Площадь:</b> S = ½·7·5√3 = 35√3/2.'];
O[1].s=['Прямая x + y − 2 = 0 имеет нормаль n = (1,1). Перпендикуляр из P идёт вдоль неё: Q = P + t·n = (1+t, 4+t).','<b>Q на прямой:</b> (1+t)+(4+t)−2 = 3+2t = 0 ⇒ t = −3/2 ⇒ Q = (−1/2, 5/2).','<b>Q — середина PP′:</b> P′ = 2Q − P = (−1−1, 5−4) = (−2, 1).','<b>Проверка:</b> в P значение 1+4−2 = 3, в P′ значение −2+1−2 = −3 ✓.'];
O[2].s=['<b>Параметры ℓ:</b> x = t, y = 1+2t, z = −1−t.','<b>Подставляем в плоскость</b> 2x−y+z−3 = 0: 2t − (1+2t) + (−1−t) − 3 = 2t−1−2t−1−t−3 = −t−5 = 0 ⇒ t = −5.','M₂ = (−5, 1−10, −1+5) = (−5, −9, 4).','<b>Направление:</b> M₁M₂ = (−5−1, −9−1, 4−1) = (−6, −10, 3).','<b>Ответ в каноническом виде</b> через M₁(1,1,1): (x−1)/(−6) = (y−1)/(−10) = (z−1)/3.'];
O[3].s=['<b>Формула:</b> объём пирамиды на трёх рёбрах = ⅙·|(a×b)·c|. Считаем определитель, раскладывая по первой строке.','det = 1·(1·1−(−1)·0) − 2·(0·1−(−1)·2) + 3·(0·0−1·2) = 1 − 2·2 + 3·(−2) = 1−4−6 = −9.','Берём модуль: 9. V = 9/6 = 3/2. Определитель не ноль ⇒ векторы некомпланарны, пирамида существует.'];
O[4].s=['<b>Формула:</b> d = |Ax₀+By₀+C|/√(A²+B²). Здесь A=4, B=3, C=−5, M(3,−1).','Числитель: |4·3 + 3·(−1) − 5| = |12−3−5| = 4. Знаменатель: √(16+9) = 5. d = 4/5.'];
O[5].s=['<b>Идея:</b> p = λ(m×n). Считаем: i(1·1−0·1) − j(2·1−0·0) + k(2·1−1·0) = (1, −2, 2).','|m×n| = √(1+4+4) = 3, а |p| = |λ|·3 = √6 ⇒ |λ| = √6/3.','<b>Знак:</b> угол с OZ тупой ⇔ z-компонента < 0. Она равна 2λ, значит λ = −√6/3.','p = (−√6/3, 2√6/3, −2√6/3). <i>Проверка:</i> |p|² = 6/9+24/9+24/9 = 6 ✓; p·m = −2√6/3+2√6/3 = 0 ✓.'];
/* задачи по шагам */
var ST={};
function tasks(L,key){var h="";L.forEach(function(t,i){var id=key+i,n=ST[id]||0,tot=t.s.length;
h+='<div class="c"><span class="tag">'+t.g+'</span><p style="margin:4px 0">'+t.c+'</p>'+(n>0?(t.fig?draw(t.fig):t.svg||''):'')+'<div class="bar"><i style="width:'+(n/tot*100)+'%"></i></div>';
for(var j=0;j<n;j++)h+='<div class="st"><b>Шаг '+(j+1)+'.</b> '+t.s[j]+'</div>';
if(n>=tot)h+='<div class="st ans">Ответ: '+t.a+'</div>';
h+='<div class="row">'+(n<tot?'<button class="b p" data-a="n" data-i="'+id+'">'+(n?'Следующий шаг':'Начать разбор')+'</button><button class="b" data-a="all" data-i="'+id+'">Показать всё</button>':'')+(n?'<button class="b" data-a="rs" data-i="'+id+'">Сначала</button>':'')+'</div></div>'});return h}
/* калькулятор */
function calc(){return '<div class="c"><h3>Векторы a и b</h3><div class="row">a: <input id="a1" value="1"><input id="a2" value="2"><input id="a3" value="3"> b: <input id="b1" value="0"><input id="b2" value="1"><input id="b3" value="-1"></div><div id="co" class="m"></div></div>'+
'<div class="c"><h3>Отражение точки относительно прямой Ax+By+C=0</h3><div class="row">P: <input id="px" value="2"><input id="py" value="5"> A,B,C: <input id="la" value="1"><input id="lb" value="-2"><input id="lc" value="3"></div><div id="ro" class="m"></div></div>'}
function f(x){return Math.abs(x)<1e-9?"0":String(Math.round(x*1e4)/1e4)}
function upd(){if(!$("#a1"))return;var v=function(i){return +$(i).value||0},a=[v("#a1"),v("#a2"),v("#a3")],b=[v("#b1"),v("#b2"),v("#b3")];
var d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2],c=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],na=Math.hypot.apply(0,a),nb=Math.hypot.apply(0,b),nc=Math.hypot.apply(0,c);
var cs=na&&nb?d/(na*nb):NaN;
$("#co").innerHTML='a·b = '+f(d)+'<br>a×b = ('+c.map(f).join(", ")+')<br>|a| = '+f(na)+', |b| = '+f(nb)+'<br>cos φ = '+f(cs)+', φ = '+(isNaN(cs)?'—':f(Math.acos(Math.max(-1,Math.min(1,cs)))*180/Math.PI)+'°')+'<br>S параллелограмма = '+f(nc)+', S треугольника = '+f(nc/2)+(Math.abs(d)<1e-9?'<br><b>Векторы перпендикулярны</b>':'')+(nc<1e-9?'<br><b>Векторы коллинеарны</b>':'');
var P=[v("#px"),v("#py")],A=v("#la"),B=v("#lb"),C=v("#lc"),n2=A*A+B*B;
if(!n2){$("#ro").textContent="A и B не могут быть оба нулевыми.";return}
var t=-(A*P[0]+B*P[1]+C)/n2,Q=[P[0]+t*A,P[1]+t*B],P2=[2*Q[0]-P[0],2*Q[1]-P[1]];
$("#ro").innerHTML='t = '+f(t)+', Q = ('+f(Q[0])+', '+f(Q[1])+'), P′ = 2Q − P = ('+f(P2[0])+', '+f(P2[1])+')'+draw({pts:{P:P,"P′":P2,Q:Q},segs:[["P","P′",1]],line:[A,B,C]})}
function dict(){return '<div class="c"><input class="w" id="q" placeholder="Найти термин" aria-label="Поиск"><dl id="dl">'+dl("")+'</dl></div>'}
function dl(q){q=q.toLowerCase();return D.filter(function(d){return (d[0]+d[1]).toLowerCase().indexOf(q)>-1}).map(function(d){return '<dt>'+d[0]+'</dt><dd>'+d[1]+'</dd>'}).join("")||'<p class="m">Ничего не найдено. Измените запрос.</p>'}
function render(){var nav="";TABS.forEach(function(t){nav+='<button data-tab="'+t[0]+'" class="'+(t[0]==cur?'on':'')+'">'+t[1]+'</button>'});$("#nav").innerHTML=nav;
$("#app").innerHTML=cur=="r"?rules():cur=="k"?calc():cur=="t"?tasks(T,"t"):cur=="o"?tasks(O,"o"):dict();upd()}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.tab){cur=b.dataset.tab;render();window.scrollTo(0,0);return}
var id=b.dataset.i;if(!id)return;var L=id[0]=="t"?T:O,t=L[+id.slice(1)];
if(b.dataset.a=="n")ST[id]=(ST[id]||0)+1;else if(b.dataset.a=="all")ST[id]=t.s.length;else ST[id]=0;render()});
document.addEventListener("input",function(e){if(e.target.id=="q")$("#dl").innerHTML=dl(e.target.value);else upd()});
render();
</script></body></html>
